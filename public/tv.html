<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UpwardScoreboard · TV</title>
  <link rel="stylesheet" href="/tv.css">
</head>
<body data-role="tv">
  <header class="top">
    <div class="church"><img class="church-logo" data-bind="church-logo" alt="" hidden><span class="church-name" data-bind="church-name"></span></div>
    <div class="league" data-bind="league"></div>
    <div class="game-info" data-bind="gameInfo"></div>
  </header>

  <main class="board">
    <section class="team home">
      <div class="side-tag" aria-hidden="true">HOME</div>
      <div class="bar"></div>
      <div class="logo" data-logo="home"></div>
      <div class="name" data-bind="home.name"></div>
      <div class="score" data-bind="home.score"></div>
      <div class="stats">
        <div><span class="lbl">FOULS</span><span class="val" data-bind="home.fouls"></span></div>
        <div><span class="lbl">TIMEOUTS</span><span class="dots" data-timeouts="home"></span></div>
        <div class="bonus">BONUS</div>
      </div>
    </section>

    <section class="center">
      <div class="grade" data-bind="grade"></div>
      <div class="clock" data-clock>--:--</div>
      <div class="period-lbl">PERIOD</div>
      <div class="period" data-bind="period"></div>
      <div class="poss"><span class="arrow-home">◀</span> POSSESSION <span class="arrow-away">▶</span></div>
      <div class="cheer"><img class="cheer-logo" data-bind="cheer-logo" alt="" hidden><span class="cheer-name" data-bind="cheer"></span></div>
    </section>

    <section class="team away">
      <div class="side-tag" aria-hidden="true">AWAY</div>
      <div class="bar"></div>
      <div class="logo" data-logo="away"></div>
      <div class="name" data-bind="away.name"></div>
      <div class="score" data-bind="away.score"></div>
      <div class="stats">
        <div><span class="lbl">FOULS</span><span class="val" data-bind="away.fouls"></span></div>
        <div><span class="lbl">TIMEOUTS</span><span class="dots" data-timeouts="away"></span></div>
        <div class="bonus">BONUS</div>
      </div>
    </section>

    <div class="banner" data-bind="banner"></div>
    <!-- Idle screen (no active game on this court). Root: .no-game, .has-next-up, .has-last-final, data-status="idle". -->
    <div class="waiting idle" id="idle">
      <div class="idle-brand"><img class="church-logo" data-bind="church-logo" alt="" hidden><div class="church-name" data-bind="church-name"></div></div>
      <div data-bind="court"></div>
      <div class="next-up" id="next-up"><span class="next-up-label">Next up</span> <span class="next-meta"><span class="next-time" data-bind="next.time"></span> <span class="next-grade" data-bind="next.grade"></span></span> <span class="next-matchup" data-bind="next.matchup"></span></div>
      <div class="last-final" data-bind="lastFinal"></div>
      <small>Waiting for the next game</small>
    </div>
  </main>

  <footer class="ticker"><b>UP NEXT</b><span data-bind="upNext"></span></footer>
  <div class="conn-dot" title="connection"></div>
  <script src="/contrast.js"></script>
  <script type="module" src="/display.js"></script>
</body>
</html>
