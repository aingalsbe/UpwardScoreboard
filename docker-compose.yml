# Local dev / POC: `docker compose up --build`. On a managed host you run only the
# `app` image and point DATABASE_URL at the host's managed Postgres.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    # .env.demo (committed, dev-only values) works out of the box, also on Windows. An optional .env
    # (never committed) overrides it. No host bind mounts; data lives in the named volume pgdata.
    env_file:
      - path: .env.demo
        required: true
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-America/Chicago}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scoreboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoreboard-dev}
      POSTGRES_DB: scoreboard
    volumes:
      - pgdata:/var/lib/postgresql/data   # teams, games, event log AND uploaded logos (bytea)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoreboard"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  pgdata:
